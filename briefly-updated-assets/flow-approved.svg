<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 320" role="img" aria-labelledby="t d">
<title id="t">From overwhelmed to prepared</title>
<desc id="d">Five thousand one hundred eighty-six emails, three hundred twelve meetings, eighteen documents and twenty-three conversations become one brief.</desc>
