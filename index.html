<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Briefly — AI meeting preparation." />
  <title>Briefly</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; background: #f6f7fb; }
    body { min-height: 100vh; }
    .page {
      position: relative;
      width: min(100%, 864px);
      margin: 0 auto;
      background: white;
      box-shadow: 0 0 45px rgba(12, 20, 40, 0.10);
    }
    .page-image {
      display: block;
      width: 100%;
      height: auto;
    }
    .hotspot {
      position: absolute;
      display: block;
      border-radius: 10px;
    }
    .hotspot:focus-visible {
      outline: 3px solid #6f55f5;
      outline-offset: 3px;
    }
    .nav-product { left: 27.8%; top: 1.1%; width: 7.5%; height: 1.5%; }
    .nav-use { left: 37.7%; top: 1.1%; width: 9%; height: 1.5%; }
    .nav-integrations { left: 50.4%; top: 1.1%; width: 9%; height: 1.5%; }
    .nav-pricing { left: 61.3%; top: 1.1%; width: 6.8%; height: 1.5%; }
    .nav-resources { left: 70.2%; top: 1.1%; width: 9%; height: 1.5%; }
    .nav-login { left: 84%; top: 1.1%; width: 5%; height: 1.5%; }
    .nav-get { left: 89.3%; top: .65%; width: 9.4%; height: 2%; }
    .hero-get { left: 7.2%; top: 17%; width: 14.3%; height: 2.4%; }
    .hero-demo { left: 23%; top: 17%; width: 13.7%; height: 2.4%; }
    .footer-get { left: 35.3%; top: 93%; width: 16.6%; height: 2.3%; }
    .footer-demo { left: 53.4%; top: 93%; width: 14.5%; height: 2.3%; }
    @media (max-width: 600px) {
      .page { box-shadow: none; }
    }
  </style>
</head>
<body>
  <main class="page">
    <img class="page-image" src="briefly-approved.png"
         alt="Briefly AI meeting copilot landing page" />

    <a class="hotspot nav-product" href="#product" aria-label="Product"></a>
    <a class="hotspot nav-use" href="#use-cases" aria-label="Use cases"></a>
    <a class="hotspot nav-integrations" href="#integrations" aria-label="Integrations"></a>
    <a class="hotspot nav-pricing" href="#pricing" aria-label="Pricing"></a>
    <a class="hotspot nav-resources" href="#resources" aria-label="Resources"></a>
    <a class="hotspot nav-login" href="#login" aria-label="Log in"></a>

    <a class="hotspot nav-get"
       href="mailto:hello@briefly.ai?subject=Briefly%20early%20access"
       aria-label="Get started free"></a>
    <a class="hotspot hero-get"
       href="mailto:hello@briefly.ai?subject=Briefly%20early%20access"
       aria-label="Get started free"></a>
    <a class="hotspot hero-demo"
       href="mailto:hello@briefly.ai?subject=Book%20a%20Briefly%20demo"
       aria-label="Book a demo"></a>
    <a class="hotspot footer-get"
       href="mailto:hello@briefly.ai?subject=Briefly%20early%20access"
       aria-label="Get started free"></a>
    <a class="hotspot footer-demo"
       href="mailto:hello@briefly.ai?subject=Book%20a%20Briefly%20demo"
       aria-label="Book a demo"></a>

    <span id="product"></span>
    <span id="use-cases"></span>
    <span id="integrations"></span>
    <span id="pricing"></span>
    <span id="resources"></span>
    <span id="login"></span>
  </main>
</body>
</html>
